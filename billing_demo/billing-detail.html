<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xxxxx - 项目账单 | Panqu AI</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.bootcdn.net/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

    <!-- Common Styles -->
    <link rel="stylesheet" href="../assets/css/common/billing-common.css">

    <!-- Tailwind CSS + DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.6.0/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Config -->
    <script src="../assets/js/common/tailwind-config.js"></script>
</head>
<body class="bg-base-200">
    <!-- Layout with Sidebar -->
    <div class="layout-with-sidebar">
        <!-- Sidebar -->
        <aside class="sidebar">
            <!-- Resize Handle -->
            <div class="sidebar-resize-handle" id="sidebarResizeHandle" aria-label="拖动调节侧边栏宽度"></div>

            <div class="sidebar-logo">
                <a href="billing.html">
                   <img src="https://panqu.com/assets/img/logo.webp" alt="盼趣AI" class="h-8">
                    <span class="gradient-text font-bold text-xl">盼趣 AI</span>
                </a>
            </div>
            <nav class="sidebar-menu">
                <a href="../../Project/index.html" class="sidebar-menu-item">
                    <i class="ri-dashboard-line"></i>
                    <span>总览</span>
                </a>
                <a href="../../Project/index.html" class="sidebar-menu-item">
                    <i class="ri-folder-3-line"></i>
                    <span>项目</span>
                </a>
                <a href="billing.html" class="sidebar-menu-item active">
                    <i class="ri-file-list-3-line"></i>
                    <span>账单</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <div class="main-content-with-sidebar">
            <!-- Navbar -->
            <div class="navbar navbar-with-sidebar sticky top-0 z-50 px-6">
                <div class="flex-none gap-3 items-center mr-4">
                    <!-- Sidebar Collapse Button -->
                    <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="切换侧边栏">
                        <i class="ri-menu-fold-line text-xl transition-transform duration-300" id="collapseIcon"></i>
                    </button>
                   
                </div>
                <div class="flex-1"></div>
                <div class="flex-none gap-3 items-center">
                    <!-- Theme Toggle -->
                    <label class="swap swap-rotate">
                        <input type="checkbox" id="theme-toggle" />
                        <i class="ri-sun-line swap-on fill-current w-6 h-6 text-orange-500 text-xl"></i>
                        <i class="ri-moon-line swap-off fill-current w-6 h-6 text-brand-600 text-xl"></i>
                    </label>

                    <!-- Notification Bell -->
                    <div class="dropdown dropdown-end">
                        <div tabindex="0" role="button" class="btn btn-ghost btn-circle">
                            <div class="indicator">
                                <i class="ri-notification-3-line text-xl"></i>
                                <span class="badge badge-sm badge-error indicator-item">2</span>
                            </div>
                        </div>
                        <ul tabindex="0" class="dropdown-content z-[1] menu p-2 shadow-xl bg-base-100 rounded-box w-80 border border-base-300">
                            <li class="menu-title">
                                <span class="font-semibold">任务消息通知</span>
                                <a class="text-xs text-brand-600">全部已读</a>
                            </li>
                            <div class="divider my-0"></div>
                            <li>
                                <a class="gap-3">
                                    <div class="avatar placeholder">
                                        <div class="bg-success text-white rounded-full w-8 h-8">
                                            <i class="ri-check-line text-sm"></i>
                                        </div>
                                    </div>
                                    <div class="flex-1">
                                        <div class="text-sm font-medium">视频生成完成</div>
                                        <div class="text-xs text-base-content/60">营销视频制作项目 • 刚刚</div>
                                    </div>
                                    <span class="badge badge-xs badge-success"></span>
                                </a>
                            </li>
                            <li>
                                <a class="gap-3">
                                    <div class="avatar placeholder">
                                        <div class="bg-info text-white rounded-full w-8 h-8">
                                            <i class="ri-information-line text-sm"></i>
                                        </div>
                                    </div>
                                    <div class="flex-1">
                                        <div class="text-sm font-medium">项目消费提醒</div>
                                        <div class="text-xs text-base-content/60">本月消费已达85,000积分 • 1小时前</div>
                                    </div>
                                    <span class="badge badge-xs badge-info"></span>
                                </a>
                            </li>
                            <div class="divider my-0"></div>
                            <li><a class="justify-center text-sm text-base-content/70">查看全部通知</a></li>
                        </ul>
                    </div>

                    <!-- Admin Badge -->
                    <div class="dropdown dropdown-end">
                        <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar placeholder rounded-full">
                            <div class="bg-gradient-to-br from-brand-500 to-purple-600 text-white rounded-full">
                                <span class="text-xs font-bold">Admin</span>
                            </div>
                        </div>
                        <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow-xl bg-base-100 rounded-box w-52 border border-base-300">
                            <li class="menu-title text-base-content/70">管理员</li>
                            <li><a class="justify-between">
                                设置
                                <span class="badge badge-sm badge-brand-500">New</span>
                            </a></li>
                            <li><a>系统日志</a></li>
                            <div class="divider my-0"></div>
                            <li><a class="text-error">退出登录</a></li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Page Content -->
            <div class="container mx-auto px-6 py-8 max-w-7xl">
        <!-- Page Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 fade-in">
            <div>
                <h1 class="text-3xl font-bold text-base-content mb-2">营销视频制作</h1>
                <p class="text-base-content/60 text-base">项目费用详情与分析</p>
            </div>
             
        </div>

        <!-- Stats Banner -->
        <div class="card bg-base-100 shadow-lg mb-6 fade-in hover:shadow-xl transition-all duration-300">
            <div class="card-body p-5">
                <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                    <div class="flex-1">
                        <div class="text-base-content/70 text-xs font-medium mb-2 flex items-center gap-2">
                            <i class="ri-funds-line text-base-content/50"></i>
                            本项目总消费
                        </div>
                        <div class="text-2xl font-bold text-base-content">85,000 积分</div>
                    </div>
                    <div class="flex gap-6">
                        <div class="text-center">
                            <div class="text-xs text-base-content/60">任务数</div>
                            <div class="text-2xl font-bold text-base-content">245</div>
                            
                        </div>
                        <div class="text-center">
                             <div class="text-xs text-base-content/60">参与成员</div>
                            <div class="text-2xl font-bold text-base-content">8</div>
                           
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <!-- Member Distribution -->
            <div class="card bg-base-100 shadow-xl fade-in">
                <div class="card-body">
                    <div class="flex justify-between items-center mb-6">
                        <div class="flex items-center gap-2">
                            <h3 class="card-title text-lg font-semibold">成员消费分布</h3>
                        </div>
                    </div>
                    <div class="space-y-2" id="memberList">
                        <!-- Member list will be populated here -->
                    </div>
                </div>
            </div>

            <!-- Model Distribution -->
            <div class="card bg-base-100 shadow-xl fade-in">
                <div class="card-body">
                    <div class="flex justify-between items-center mb-6">
                        <div class="flex items-center gap-2">
                            <h3 class="card-title text-lg font-semibold">任务类型分布</h3>
                        </div>
                    </div>
                    <div class="h-64">
                        <canvas id="modelChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4">
            <h3 class="text-xl font-bold text-base-content">详细记录</h3>
            <div class="flex gap-3 w-full md:w-auto">
                <select id="memberFilter" class="select select-bordered select-sm flex-1 md:flex-none focus:outline-none">
                    <option value="all">全部成员</option>
                    <option value="Alice">Alice</option>
                    <option value="Bob">Bob</option>
                    <option value="Charlie">Charlie</option>
                </select>
                <select id="modelFilter" class="select select-bordered select-sm flex-1 md:flex-none focus:outline-none">
                    <option value="all">全部模型</option>
                    <option value="seedream">Seedream</option>
                    <option value="seedance">Seedance</option>
                    <option value="doubao">豆包TTS</option>
                </select>
            </div>
        </div>

        <!-- Detail Table -->
        <div class="overflow-x-auto bg-base-100 rounded-xl shadow-xl fade-in">
            <table class="table table-zebra table-pin-rows">
                <thead class="bg-base-200">
                    <tr>
                        <th>时间</th>
                        <th>成员</th>
                        <th>模型功能</th>
                        <th>消耗积分</th>
                    </tr>
                </thead>
                <tbody id="detailTableBody">
                    <!-- Table rows will be populated by JavaScript -->
                </tbody>
            </table>

            <!-- Pagination -->
            <div class="flex flex-col md:flex-row justify-between items-center gap-4 px-6 py-4 bg-base-200/50">
                <div class="text-sm text-base-content/70">
                    显示第 <span id="paginationStart" class="font-bold text-base-content">1</span>
                    到 <span id="paginationEnd" class="font-bold text-base-content">10</span>
                    条，共 <span id="paginationTotal" class="font-bold text-base-content">0</span> 条记录
                </div>
                <div class="join">
                    <button id="firstPageBtn" class="join-item btn btn-sm" disabled>
                        <i class="ri-skip-back-line"></i>
                    </button>
                    <button id="prevPageBtn" class="join-item btn btn-sm" disabled>
                        <i class="ri-arrow-left-s-line"></i>
                    </button>
                    <button id="page1Btn" class="join-item btn btn-sm btn-active">1</button>
                    <button id="page2Btn" class="join-item btn btn-sm">2</button>
                    <button id="page3Btn" class="join-item btn btn-sm">3</button>
                    <button id="nextPageBtn" class="join-item btn btn-sm">
                        <i class="ri-arrow-right-s-line"></i>
                    </button>
                    <button id="lastPageBtn" class="join-item btn btn-sm">
                        <i class="ri-skip-forward-line"></i>
                    </button>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-sm text-base-content/70">每页显示</span>
                    <select id="pageSizeSelect" class="select select-bordered select-sm w-20">
                        <option value="10">10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                    </select>
                    <span class="text-sm text-base-content/70">条</span>
                </div>
            </div>
        </div>
    </div>
        </div>
    </div>

    <!-- Common JavaScript -->
    <script src="../assets/js/common/billing-common.js"></script>

    <!-- Page-specific JavaScript -->
    <script src="billing-detail-v2.js"></script>
</body>
</html>
