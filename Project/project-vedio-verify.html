    <script>
        // Tab切换
        const tabs = document.querySelectorAll('.tab');
        const formCompany = document.getElementById('form-company');
        const formPersonal = document.getElementById('form-personal');

        tabs.forEach(tab => {
            tab.addEventListener('click', function() {
                tabs.forEach(t => t.classList.remove('tab-active'));
                this.classList.add('tab-active');

                if (this.id === 'tab-company-btn') {
                    formCompany.classList.remove('hidden');
                    formPersonal.classList.add('hidden');
                } else {
                    formCompany.classList.add('hidden');
                    formPersonal.classList.remove('hidden');
                }
            });
        });

        // 文件上传预览
        document.querySelectorAll('.upload-item').forEach(item => {
            const container = item;
            const fileInput = container.querySelector('input[type="file"]');
            const preview = container.querySelector('.preview-image');
            const placeholder = container.querySelector('.upload-placeholder');

            container.addEventListener('click', (e) => {
                if (e.target !== fileInput) {
                    fileInput.click();
                }
            });

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        preview.querySelector('img').src = e.target.result;
                        preview.classList.remove('hidden');
                        placeholder.classList.add('hidden');
                    };
                    reader.readAsDataURL(file);
                }
            });
        });

        // 获取验证码倒计时
        document.querySelectorAll('.btn-send-code').forEach(btn => {
            btn.addEventListener('click', function() {
                const targetInputId = this.dataset.target;
                let countdown = 60;
                this.disabled = true;

                const timer = setInterval(() => {
                    countdown--;
                    if (countdown <= 0) {
                        clearInterval(timer);
                        this.textContent = '获取验证码';
                        this.disabled = false;
                    } else {
                        this.textContent = `${countdown}s 后重发`;
                    }
                }, 1000);
            });
        });

        // 主题切换
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;

        const currentTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', currentTheme);
        themeToggle.checked = currentTheme === 'dark';

        themeToggle.addEventListener('change', () => {
            const theme = themeToggle.checked ? 'dark' : 'light';
            html.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        });
    </script>
