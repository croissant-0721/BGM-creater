<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目管理 | Panqu AI</title>

    <!-- Shared Configuration -->
    <link rel="stylesheet" href="../billing_demo/v2/shared/styles.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <!-- Tailwind CSS + DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.6.0/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#E8EEFF',
                            100: '#C4D4FF',
                            200: '#9DB6FF',
                            300: '#7599FF',
                            400: '#4D7CFF',
                            500: '#2560FF',
                            600: '#002FA7',
                            700: '#002687',
                            800: '#001D67',
                            900: '#001447',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen bg-base-200">
    <!-- Navbar -->
    <div class="navbar bg-base-100/80 backdrop-blur-md shadow-lg sticky top-0 z-50">
        <div class="flex-1">
            <a href="#" class="btn btn-ghost text-xl">
                <i class="ri-robot-2-fill text-brand-600 text-2xl"></i>
                <span class="gradient-text font-bold">Panqu AI</span>
            </a>
        </div>
        <div class="flex-none">
            <ul class="menu menu-horizontal px-1 gap-2">
                <li><a href="#" class="hover:text-brand-600 transition-colors">控制台</a></li>
                <li><a class="text-brand-600 font-semibold">项目列表</a></li>
                <li><a href="#" class="hover:text-brand-600 transition-colors">Playground</a></li>
                <li><a href="../billing_demo/v2/billing.html" class="hover:text-brand-600 transition-colors">账单</a></li>
            </ul>
        </div>
        <div class="flex-none gap-3 items-center">
            <!-- Theme Toggle -->
            <label class="swap swap-rotate btn btn-ghost btn-circle">
                <input type="checkbox" id="theme-toggle" />
                <i class="ri-sun-line swap-on fill-current w-6 h-6 text-orange-500"></i>
                <i class="ri-moon-line swap-off fill-current w-6 h-6 text-brand-600"></i>
            </label>

            <!-- User Dropdown -->
            <div class="dropdown dropdown-end">
                <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar placeholder border-2 border-brand-200 hover:border-brand-500 transition-all hover:scale-105">
                    <div class="bg-gradient-to-br from-brand-500 to-purple-600 text-white">
                        <span class="text-xs font-bold">C</span>
                    </div>
                </div>
                <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow-xl bg-base-100 rounded-box w-52 border border-base-300">
                    <li class="menu-title text-base-content/70">Chuck</li>
                    <li><a class="justify-between">
                        个人设置
                        <span class="badge badge-sm badge-brand-500">New</span>
                    </a></li>
                    <li><a>使用统计</a></li>
                    <li><a>API密钥</a></li>
                    <div class="divider my-0"></div>
                    <li><a class="text-error">退出登录</a></li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- Page Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 fade-in">
            <div>
                <h1 class="text-3xl font-bold text-base-content mb-2">项目管理</h1>
                <p class="text-base-content/60 text-base">管理和监控您的所有 AI 项目</p>
            </div>
            <div class="flex gap-3">
                <button class="btn btn-outline gap-2" onclick="dashboard.refreshProjects()">
                    <i class="ri-refresh-line"></i>
                    刷新
                </button>
                <button class="btn bg-brand-600 text-white border-0 gap-2 hover:bg-brand-700" onclick="dashboard.showAddProjectModal()">
                    <i class="ri-add-line"></i>
                    添加项目
                </button>
            </div>
        </div>

        <!-- Stats Banner -->
        <div class="card bg-base-100 shadow-xl mb-6 fade-in hover:shadow-2xl transition-all duration-300">
            <div class="card-body p-5">
                <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                    <div class="flex-1">
                        <div class="text-base-content/70 text-xs font-medium mb-2 flex items-center gap-2">
                            <i class="ri-folder-line text-base-content/50"></i>
                            总项目数
                        </div>
                        <div class="text-2xl font-bold text-base-content mb-1">24</div>
                        <div class="text-xs text-base-content/60">本月新增: 8 个项目</div>
                    </div>
                    <div class="flex gap-8">
                        <div class="text-center">
                            <div class="text-xs text-base-content/60">总生成次数</div>
                            <div class="text-2xl font-bold text-base-content">12,450</div>
                        </div>
                        <div class="text-center">
                            <div class="text-xs text-base-content/60">活跃项目</div>
                            <div class="text-2xl font-bold text-brand-600">16</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Search & Filter -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
            <h3 class="text-lg font-bold text-base-content">所有项目</h3>
            <div class="form-control">
                <div class="input-group">
                    <input type="search" id="projectSearch" placeholder="搜索项目..." class="input input-bordered focus:outline-none focus:ring-2 focus:ring-brand-500" />
                    <button class="btn btn-square btn-ghost border-l-0 border-r-0 border-t-0 border-b-0 border-base-300">
                        <i class="ri-search-line"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Projects Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6" id="projectsGrid">
            <!-- Project Card Example -->
            <div class="card bg-base-100 shadow-xl hover:shadow-2xl transition-all duration-300 fade-in cursor-pointer group">
                <div class="card-body p-5">
                    <div class="flex items-start justify-between mb-3">
                        <div class="text-4xl group-hover:scale-110 transition-transform">🎬</div>
                        <div class="badge badge-primary badge-sm">活跃</div>
                    </div>
                    <h3 class="card-title text-lg mb-1">营销视频制作</h3>
                    <p class="text-sm text-base-content/60 mb-3">AI 视频生成项目</p>
                    <div class="flex justify-between items-center text-xs text-base-content/70">
                        <span><i class="ri-movie-line mr-1"></i>1,245 次生成</span>
                        <span class="text-brand-600 font-semibold">52K 积分</span>
                    </div>
                </div>
            </div>

            <!-- More project cards will be rendered by JavaScript -->
        </div>
    </div>

    <!-- Add Project Modal -->
    <dialog id="add_project_modal" class="modal">
        <div class="modal-box">
            <form method="dialog">
                <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
            </form>
            <h3 class="font-bold text-2xl mb-6 gradient-text">添加新项目</h3>

            <form id="addProjectForm" class="space-y-4">
                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-semibold">项目名称</span>
                    </label>
                    <input type="text" placeholder="输入项目名称" class="input input-bordered w-full focus:outline-none focus:ring-2 focus:ring-brand-500" required />
                </div>

                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-semibold">项目描述</span>
                    </label>
                    <textarea placeholder="输入项目描述" class="textarea textarea-bordered h-24 focus:outline-none focus:ring-2 focus:ring-brand-500"></textarea>
                </div>

                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-semibold">项目类型</span>
                    </label>
                    <select class="select select-bordered w-full focus:outline-none focus:ring-2 focus:ring-brand-500">
                        <option>视频生成</option>
                        <option>音频生成</option>
                        <option>图像生成</option>
                        <option>文本生成</option>
                    </select>
                </div>

                <div class="modal-action">
                    <button type="submit" class="btn bg-brand-600 text-white border-0 w-full hover:bg-brand-700">
                        <i class="ri-add-line mr-2"></i>
                        创建项目
                    </button>
                </div>
            </form>
        </div>
        <form method="dialog" class="modal-backdrop">
            <button>close</button>
        </form>
    </dialog>

    <!-- JavaScript -->
    <script>
        // Theme Toggle
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;

        // Initialize theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', savedTheme);
        themeToggle.checked = savedTheme === 'light';

        themeToggle.addEventListener('change', () => {
            const newTheme = themeToggle.checked ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });

        // Dashboard functionality (placeholder)
        const dashboard = {
            refreshProjects: function() {
                console.log('Refreshing projects...');
                // Add refresh logic here
            },
            showAddProjectModal: function() {
                document.getElementById('add_project_modal').showModal();
            }
        };

        // Search functionality
        const searchInput = document.getElementById('projectSearch');
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            // Add search logic here
            console.log('Searching for:', searchTerm);
        });
    </script>
</body>

</html>
